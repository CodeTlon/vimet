# Entorno local de desarrollo (rama dev): Postgres 16 + MinIO (S3 compatible).
# test y prod viven en Coolify. Credenciales de ESTE archivo: solo desarrollo local, nunca se reutilizan.
#
# Puertos solo en loopback. En la VPS (cuenta dev1) usar el rango propio, ver /etc/dev-ports.conf:
#   VIMET_DB_PORT=41432 VIMET_S3_PORT=41900 VIMET_S3_CONSOLE_PORT=41901 docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vimet
      POSTGRES_PASSWORD: vimet
      POSTGRES_DB: vimet
    ports:
      - '127.0.0.1:${VIMET_DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vimet -d vimet']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vimet-dev
      MINIO_ROOT_PASSWORD: vimet-dev-secret
    ports:
      - '127.0.0.1:${VIMET_S3_PORT:-9000}:9000'
      - '127.0.0.1:${VIMET_S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'timeout 3 bash -c "</dev/tcp/127.0.0.1/9000"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea los buckets una vez. planes y recursos son privados (URLs firmadas);
  # ejercicios-media y sitio son de lectura publica, como en Supabase hoy.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 vimet-dev vimet-dev-secret &&
        mc mb --ignore-existing local/planes local/recursos local/ejercicios-media local/sitio &&
        mc anonymous set none local/planes &&
        mc anonymous set none local/recursos &&
        mc anonymous set download local/ejercicios-media &&
        mc anonymous set download local/sitio

volumes:
  pgdata:
  miniodata:
