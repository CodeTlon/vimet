name: Entornos

# PR hacia `main`: enciende el entorno `test` (app apagada en Coolify, rama `test`),
# deploya, corre el smoke E2E contra esa URL y lo apaga al cerrar el PR.
#
# Prerrequisitos (los crea el usuario, ver docs/FLUJO-ENTORNOS.md):
#   Secrets del repo: COOLIFY_URL, COOLIFY_TOKEN, TEST_APP_UUID, TEST_URL,
#                     TEST_SUPABASE_URL, TEST_SUPABASE_SERVICE_ROLE_KEY
#   El Supabase de TEST es el proyecto `vimet-dev`: NUNCA el de produccion
#   (e2e/global-setup.ts se niega a correr contra el ref de prod).
# Tras la migracion a backend propio, se suman TEST_DB_UUID y el paso de migraciones.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: entornos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
  TEST_APP_UUID: ${{ secrets.TEST_APP_UUID }}

jobs:
  test-env:
    if: github.event.action != 'closed' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Encender y deployar la app de test
        run: |
          [ -n "$TEST_APP_UUID" ] || { echo "::error::falta el secret TEST_APP_UUID"; exit 1; }
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/applications/$TEST_APP_UUID/start" || true
          id=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$TEST_APP_UUID&force=true" | jq -r '.deployments[0].deployment_uuid')
          for i in $(seq 1 90); do
            estado=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deployments/$id" | jq -r '.status')
            echo "estado: $estado"
            case "$estado" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::deploy de test termino en $estado"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::deploy de test no termino en 15 minutos"; exit 1

      - name: Smoke E2E contra test
        run: |
          npx playwright install --with-deps chromium
          npx wait-on "${{ secrets.TEST_URL }}/login" --timeout 180000
          npx playwright test
        env:
          BASE_URL: ${{ secrets.TEST_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  apagar-test:
    if: github.event.action == 'closed' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Apagar app de test
        run: |
          [ -n "$TEST_APP_UUID" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/applications/$TEST_APP_UUID/stop" || true
